<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFTARO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">GIFTARO</div>
        <div class="profile">Профиль</div>
    </header>

    <main>
        <section class="hero">
            <h1>Мир Telegram-подарков</h1>
            <p>Находи редкие NFT и пополняй свою коллекцию</p>
            <input type="text" placeholder="Поиск подарков...">
        </section>

        <section class="catalog">
            <h2>Популярные подарки</h2>
            <div class="empty">
                Скоро здесь появятся подарки
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
